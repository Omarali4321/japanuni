spring:
  application:
    name: japanuni-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/japanuni}
    username: ${SPRING_DATASOURCE_USERNAME:japanuni}
    password: ${SPRING_DATASOURCE_PASSWORD:japanuni}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRvLWEtYmFzZTY0LWVuY29kZWQtc2VjcmV0LWtleS0zMmJ5dGVzLW1pbmltdW0=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.japanuni: INFO
