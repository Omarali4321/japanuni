services:
  db:
    image: postgres:16-alpine
    container_name: japanuni-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-japanuni}
      POSTGRES_USER: ${POSTGRES_USER:-japanuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-japanuni}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-japanuni}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: japanuni-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-japanuni}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-japanuni}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-japanuni}
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLXRvLWEtYmFzZTY0LWVuY29kZWQtc2VjcmV0LWtleS0zMmJ5dGVzLW1pbmltdW0=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: japanuni-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
